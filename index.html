<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AOG Treasure Hunt 2026</title>
    <meta name="description" content="AOG Treasure Hunt 2026.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="AOG Treasure Hunt 2026">
    <meta property="og:description" content="AOG Treasure Hunt 2026.">
    <meta name="theme-color" content="#776537">
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0614; }
        /* desktop: blurred poster behind the phone-shaped frame */
        body::before {
            content: ""; position: fixed; inset: -10%;
            background: url(gyro/bg.webp) center / cover;
            filter: blur(40px) brightness(.55);
        }
        .frame {
            position: fixed; top: 0; bottom: 0; left: 50%;
            width: min(100vw, calc(100vh * 9 / 16));
            width: min(100vw, calc(100dvh * 9 / 16));
            transform: translateX(-50%);
            overflow: hidden;
            background: #776537; /* exact top-row colour of the poster, fills tall phones */
            opacity: 0; transition: opacity .6s;
        }
        .ready .frame { opacity: 1; }

        /* everything below lives in 1080x1920 poster pixels, scaled by JS */
        .fg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; perspective: 1600px; perspective-origin: 540px 960px; }
        .fg img, .L { position: absolute; display: block; will-change: transform; }
        .bgimg { left: 0; top: 0; width: 1080px; height: 1920px; }
        .bob { position: absolute; inset: 0; }

        .hg { left: 7px; top: 437px; width: 1070px; height: 474px; transform-style: preserve-3d; transform-origin: 535px 236px; }
        .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .face.back { transform: translateZ(-40px) rotateY(180deg) scaleX(-1); }
        .face img { position: absolute; left: 0; top: 0; }
        .face .txt { left: 265px; top: 368px; }
        .slab, .shine {
            position: absolute; left: 0; top: 0; width: 1070px; height: 359px;
            -webkit-mask: url(gyro/shape.webp) 0 0 / 100% 100%; mask: url(gyro/shape.webp) 0 0 / 100% 100%;
        }
        .slab { background: #1c038a; }
        .shine {
            background: linear-gradient(105deg, transparent 42%, rgba(255,255,255,.6) 50%, transparent 58%) no-repeat;
            background-size: 300% 100%;
            animation: shine 5s ease-in-out infinite;
        }
        @keyframes shine {
            0% { background-position: 110% 0; }
            30%, 100% { background-position: -10% 0; }
        }

        .stars { left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
        .star {
            position: absolute; border-radius: 50%; opacity: 0;
            background: radial-gradient(circle, #fff 0, rgba(255,255,255,.9) 22%, rgba(255,255,255,0) 68%);
            animation: tw var(--d) ease-in-out var(--dl) infinite;
        }
        @keyframes tw {
            0%, 100% { opacity: 0; transform: scale(.4); }
            50% { opacity: var(--o); transform: scale(1); }
        }

        /* tap-to-enter start screen; the tap is what lets iOS ask for motion permission */
        #loader {
            position: fixed; inset: 0; z-index: 50; width: 100%; margin: 0; padding: 0; border: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
            background: #000; color: inherit; cursor: pointer; transition: opacity .5s;
            -webkit-tap-highlight-color: transparent;
        }
        #loader:disabled { cursor: default; }
        #loader.gone { opacity: 0; pointer-events: none; }
        #loader span { display: block; }
        #loader-msg {
            color: #eab308; font: 12px/16px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .1em;
            animation: pulse 2s cubic-bezier(.4, 0, .6, 1) infinite;
        }
        @keyframes pulse { 50% { opacity: .5; } }

        /* Pixel-art treasure chest loader (same as index.html) */
        .pixel-chest {
            position: relative;
            width: 64px;
            height: 64px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        .pixel-chest-lid,
        .pixel-chest-body {
            position: absolute;
            left: 0;
            width: 4px;
            height: 4px;
            background: transparent;
            box-shadow:
                /* LID (top arc, gold/brown) */
                8px 4px 0 #b8860b, 12px 4px 0 #b8860b, 16px 4px 0 #b8860b, 20px 4px 0 #b8860b, 24px 4px 0 #b8860b, 28px 4px 0 #b8860b, 32px 4px 0 #b8860b, 36px 4px 0 #b8860b, 40px 4px 0 #b8860b, 44px 4px 0 #b8860b, 48px 4px 0 #b8860b,
                4px 8px 0 #8b6508, 8px 8px 0 #ffd700, 12px 8px 0 #ffd700, 16px 8px 0 #ffd700, 20px 8px 0 #ffd700, 24px 8px 0 #ffd700, 28px 8px 0 #ffd700, 32px 8px 0 #ffd700, 36px 8px 0 #ffd700, 40px 8px 0 #ffd700, 44px 8px 0 #ffd700, 48px 8px 0 #ffd700, 52px 8px 0 #8b6508;
        }
        .pixel-chest-body {
            top: 28px;
            box-shadow:
                /* BODY (wood with gold band) */
                4px 0 0 #5a3a1a, 8px 0 0 #8b5a2b, 12px 0 0 #8b5a2b, 16px 0 0 #8b5a2b, 20px 0 0 #8b5a2b, 24px 0 0 #8b5a2b, 28px 0 0 #8b5a2b, 32px 0 0 #8b5a2b, 36px 0 0 #8b5a2b, 40px 0 0 #8b5a2b, 44px 0 0 #8b5a2b, 48px 0 0 #8b5a2b, 52px 0 0 #5a3a1a,
                4px 4px 0 #5a3a1a, 8px 4px 0 #ffd700, 12px 4px 0 #ffd700, 16px 4px 0 #ffd700, 20px 4px 0 #ffd700, 24px 4px 0 #ffd700, 28px 4px 0 #ffd700, 32px 4px 0 #ffd700, 36px 4px 0 #ffd700, 40px 4px 0 #ffd700, 44px 4px 0 #ffd700, 48px 4px 0 #ffd700, 52px 4px 0 #5a3a1a,
                4px 8px 0 #5a3a1a, 8px 8px 0 #8b5a2b, 48px 8px 0 #8b5a2b, 52px 8px 0 #5a3a1a,
                4px 12px 0 #5a3a1a, 8px 12px 0 #8b5a2b, 48px 12px 0 #8b5a2b, 52px 12px 0 #5a3a1a;
        }
        .pixel-chest-lid {
            top: 8px;
            animation: lidBounce 1s steps(2) infinite alternate;
        }
        @keyframes lidBounce {
            0% { top: 8px; }
            100% { top: 0px; }
        }
        .pixel-sparkle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fffacd;
            box-shadow: 0 0 4px #fffacd;
            opacity: 0;
        }
        .pixel-sparkle-1 { top: 0; left: 50%; animation: sparkle 1.2s ease-in-out infinite; }
        .pixel-sparkle-2 { top: 4px; left: 25%; animation: sparkle 1.2s ease-in-out infinite 0.4s; }
        .pixel-sparkle-3 { top: 4px; left: 75%; animation: sparkle 1.2s ease-in-out infinite 0.8s; }
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="frame" id="frame">
        <div class="fg" id="fg">
            <img class="bgimg" id="bg" src="gyro/bg.webp" alt="">
            <div class="bob" id="bob">
                <!-- each box = panel + its text on a separate, deeper layer -->
                <img id="top" src="gyro/top.webp" style="left:237px;top:140px" alt="">
                <img id="top-t" src="gyro/top-text.webp" style="left:331px;top:222px" alt="The game is on. Register now before the spots run out!">
                <img id="b1" src="gyro/b1.webp" style="left:63px;top:909px" alt="">
                <img id="b1-t" src="gyro/b1-text.webp" style="left:161px;top:988px" alt="Batch 1: 2/10/2026, 18.30 WIB, Pakuwon City Mall 3 Lt. P8, Jl. Kejawan Putih Mutiara 17, Surabaya">
                <img id="b2" src="gyro/b2.webp" style="left:575px;top:921px" alt="">
                <img id="b2-t" src="gyro/b2-text.webp" style="left:686px;top:1015px" alt="Batch 2: 9/10/2026, 18.30 WIB, Pakuwon Mall Lt. Rooftop 2, Jl. Puncak Indah Lontar 2, Surabaya">
                <img id="reg" src="gyro/reg.webp" style="left:319px;top:1320px" alt="">
                <img id="reg-t" src="gyro/reg-text.webp" style="left:400px;top:1372px" alt="Open registration: 16-27 September 2026 (via CG fun leaders and Treasure Hunt booth)">
                <div class="L hg" id="hg">
                    <div class="face front">
                        <img src="gyro/heading.webp" alt="Treasure Hunt 5.0 — Into the game world">
                        <img class="txt" src="gyro/text.webp" alt="">
                        <div class="shine"></div>
                    </div>
                    <!-- extruded blue edge, visible while the heading spins -->
                    <div class="slab" style="transform:translateZ(-4px)"></div>
                    <div class="slab" style="transform:translateZ(-8px)"></div>
                    <div class="slab" style="transform:translateZ(-12px)"></div>
                    <div class="slab" style="transform:translateZ(-16px)"></div>
                    <div class="slab" style="transform:translateZ(-20px)"></div>
                    <div class="slab" style="transform:translateZ(-24px)"></div>
                    <div class="slab" style="transform:translateZ(-28px)"></div>
                    <div class="slab" style="transform:translateZ(-32px)"></div>
                    <div class="slab" style="transform:translateZ(-36px)"></div>
                    <div class="face back">
                        <img src="gyro/heading.webp" alt="">
                        <img class="txt" src="gyro/text.webp" alt="">
                    </div>
                </div>
            </div>
            <div class="L stars" id="stars"></div>
        </div>
    </div>
    <button id="loader" disabled>
        <span class="pixel-chest">
            <span class="pixel-chest-lid"></span>
            <span class="pixel-chest-body"></span>
            <span class="pixel-sparkle pixel-sparkle-1"></span>
            <span class="pixel-sparkle pixel-sparkle-2"></span>
            <span class="pixel-sparkle pixel-sparkle-3"></span>
        </span>
        <span id="loader-msg">LOADING TREASURE…</span>
    </button>

    <script>
    (function () {
        var $ = function (id) { return document.getElementById(id); };
        var frame = $('frame'), fg = $('fg'), bob = $('bob'), hg = $('hg');
        var txts = document.querySelectorAll('.txt');

        // ---- timeline measured frame-by-frame from video-full.mp4 (30fps, 341-frame loop) ----
        var LOOP = 341;
        // vertical bob of the text group, sampled every 3 frames across the whole loop (the 3 cycles differ by a few px)
        var BOB = [201,199,192,182,169,155,140,123,106,89,72,56,40,25,12,0,-10,-17,-21,-21,-18,-10,0,13,27,42,58,74,91,108,124,139,153,166,178,187,195,200,201,199,192,182,169,155,140,123,106,89,72,56,40,25,12,0,-10,-17,-21,-21,-18,-10,1,14,28,44,60,77,94,110,127,142,156,169,181,190,197,200,201,197,189,178,165,150,134,118,100,83,67,50,35,20,8,-3,-12,-18,-22,-21,-15,-7,5,18,33,49,66,83,99,116,132,147,161,173,184,192,198,201];
        // 360° heading spin: starts at frames 48 and 187, lasts 52 frames, eased like the video
        var SPIN_T = [0,.135,.23,.31,.365,.40,.44,.54,.615,.69,.77,.846,1];
        var SPIN_A = [0,14,35,62,90,118,180,270,311,332,344,352,360];
        // right edge (px in text.webp) of each of the 16 letters of INTO THE GAME WORLD
        var ENDS = [35,72,99,130,166,195,219,262,293,329,353,409,438,465,489,516];
        var TEXT_W = 543;
        var DIM = [[21,25],[27,30],[147,150],[153,156],[241,244],[247,250]];

        var BOB_SCALE = .25; // calmer than the video: same timing, a quarter of the travel, around its average position (90)
        function bobAt(f) {
            var p = f / 3, i = Math.floor(p), t = p - i;
            var raw = BOB[i] + (BOB[(i + 1) % BOB.length] - BOB[i]) * t;
            return 90 + (raw - 90) * BOB_SCALE;
        }
        function spinAt(f) {
            var starts = [48, 187];
            for (var s = 0; s < 2; s++) {
                var t = (f - starts[s]) / 52;
                if (t > 0 && t < 1) {
                    var i = 1; while (SPIN_T[i] < t) i++;
                    var u = (t - SPIN_T[i - 1]) / (SPIN_T[i] - SPIN_T[i - 1]);
                    return -(SPIN_A[i - 1] + (SPIN_A[i] - SPIN_A[i - 1]) * u);
                }
            }
            return 0;
        }
        function lettersAt(f) {
            if (f < 17) return Math.min(16, Math.floor(f));
            if (f < 97) return 16;
            if (f < 107) return Math.round(16 * (107 - f) / 10); // backspace
            if (f < 128) return 0;
            if (f < 145) return Math.min(16, Math.floor(f - 128));
            if (f < 311) return 16;
            if (f < 321) return Math.round(16 * (321 - f) / 10);
            return 0;
        }

        // ---- layout: poster fills the width, anchored to the bottom; extra height shows the flat top colour ----
        var s = 1;
        function layout() {
            var fw = frame.clientWidth, fh = frame.clientHeight;
            var contain = Math.min(fw / 1080, fh / 1920), cover = Math.max(fw / 1080, fh / 1920);
            // up to 5% zoom past fit (side crop ~26 poster px, heading starts at 58) to shrink the empty top band on tall phones
            s = Math.min(cover, contain * 1.05);
            var left = (fw - 1080 * s) / 2, top = fh - 1920 * s;
            fg.style.transform = 'translate(' + left + 'px,' + top + 'px) scale(' + s + ')';
        }
        window.addEventListener('resize', layout);
        layout();

        // ---- twinkling stars / bokeh like the video ----
        var stars = $('stars');
        for (var n = 0; n < 26; n++) {
            var big = n < 8, el = document.createElement('i'), size = big ? 30 + Math.random() * 30 : 6 + Math.random() * 8;
            el.className = 'star';
            el.style.cssText = 'left:' + (Math.random() * 1040) + 'px;top:' + (80 + Math.random() * 1500) + 'px;width:' + size + 'px;height:' + size +
                'px;--d:' + (2.5 + Math.random() * 3).toFixed(2) + 's;--dl:-' + (Math.random() * 5).toFixed(2) + 's;--o:' + (big ? .85 : 1);
            stars.appendChild(el);
        }

        // ---- tilt input: gyro on phones, mouse on desktop ----
        var tx = 0, ty = 0, cx = 0, cy = 0, base = null;
        var clamp = function (v) { return Math.max(-1, Math.min(1, v)); };
        function onOrient(e) {
            if (e.beta == null) return;
            if (!base) base = { b: e.beta, g: e.gamma };
            // ponytail: neutral pose slowly follows how the phone is held (~8s), so the effect re-centres itself
            base.b += (e.beta - base.b) * 0.002;
            base.g += (e.gamma - base.g) * 0.002;
            tx = clamp((e.gamma - base.g) / 12);
            ty = clamp((e.beta - base.b) / 12);
        }
        // iOS only shares motion data after a permission prompt started by a tap (see enter()); Android starts right away
        var needsPermission = window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function';
        if (!needsPermission) window.addEventListener('deviceorientation', onOrient);
        window.addEventListener('pointermove', function (e) {
            if (e.pointerType !== 'mouse') return;
            tx = clamp((e.clientX / innerWidth - .5) * 2);
            ty = clamp((e.clientY / innerHeight - .5) * 2);
        });

        // ---- render ----
        var MAX = 36; // poster px of travel at depth 1
        var Y_SCALE = 0.5; // vertical translation is more subtle than horizontal
        var TEXT_LIFT = .45; // box text floats this much deeper than its panel
        var bgEl = $('bg');
        var BG_ROT = 6; // degrees bg counter-rotates against tilt — subtler than hg's, it's a backdrop not the focal point
        var layers = [[$('top'), .55], [$('b1'), .7], [$('b2'), .7], [$('reg'), .8],
            [$('top-t'), .55 + TEXT_LIFT], [$('b1-t'), .7 + TEXT_LIFT], [$('b2-t'), .7 + TEXT_LIFT], [$('reg-t'), .8 + TEXT_LIFT], [stars, 1.2]];
        function render(f) {
            cx += (tx - cx) * .08; cy += (ty - cy) * .08;
            var bgD = .2 * MAX;
            bgEl.style.transform = 'translate3d(' + (cx * bgD).toFixed(2) + 'px,' + (cy * bgD * Y_SCALE).toFixed(2) + 'px,0) rotateX(' + (cy * BG_ROT).toFixed(2) + 'deg) rotateY(' + (-cx * BG_ROT).toFixed(2) + 'deg) scale(1.12)';
            for (var i = 0; i < layers.length; i++) {
                var L = layers[i], d = L[1] * MAX;
                L[0].style.transform = 'translate3d(' + (cx * d).toFixed(2) + 'px,' + (cy * d * Y_SCALE).toFixed(2) + 'px,0)' + (L[2] ? ' scale(' + L[2] + ')' : '');
            }
            bob.style.transform = 'translateY(' + bobAt(f).toFixed(2) + 'px)';
            hg.style.transform = 'translate3d(' + (cx * MAX).toFixed(2) + 'px,' + (cy * MAX * Y_SCALE).toFixed(2) + 'px,0) rotateX(' + (-cy * 10).toFixed(2) + 'deg) rotateY(' + (spinAt(f) + cx * 14).toFixed(2) + 'deg)';
            var k = lettersAt(f), x = k ? ENDS[k - 1] + 3 : 0, dim = false;
            for (var j = 0; j < DIM.length; j++) if (f >= DIM[j][0] && f < DIM[j][1]) dim = true;
            for (var t = 0; t < txts.length; t++) {
                txts[t].style.clipPath = 'inset(0 ' + (TEXT_W - x) + 'px 0 0)';
                txts[t].style.opacity = dim ? .35 : 1;
            }
        }

        var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        var imgs = [].slice.call(document.images);
        var loader = $('loader'), entered = false;
        function onAssetsReady() {
            if (needsPermission) {
                if (!loader.disabled) return;
                loader.disabled = false;
                $('loader-msg').textContent = 'TAP TO ENTER';
            } else {
                enter();
            }
        }
        function enter() {
            if (entered) return;
            entered = true;
            // must run synchronously inside the tap, or iOS refuses to show the prompt
            if (needsPermission) {
                DeviceOrientationEvent.requestPermission().then(function (state) {
                    if (state === 'granted') window.addEventListener('deviceorientation', onOrient);
                }).catch(function () {});
            }
            loader.classList.add('gone');
            document.body.classList.add('ready');
            if (reduced) { render(45); return; }
            var t0 = performance.now(); // timeline starts at frame 0 so the typing begins as the poster appears
            (function loop(now) {
                render(((now - t0) / 1000 * 30) % LOOP);
                requestAnimationFrame(loop);
            })(t0);
        }
        loader.addEventListener('click', enter);
        Promise.all(imgs.map(function (im) { return im.decode ? im.decode().catch(function () {}) : 0; })).then(onAssetsReady);
        setTimeout(onAssetsReady, 4000); // never stay stuck on loading if a decode stalls

        window.__render = render; // used by the screenshot check
    })();
    </script>
</body>
</html>
